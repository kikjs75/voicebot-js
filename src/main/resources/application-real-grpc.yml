# real-grpc profile — CLOVA Speech gRPC STT + CLOVA Voice TTS + Claude LLM
spring:
  config:
    activate:
      on-profile: real-grpc

voicebot:
  stt:
    clova-speech:
      host: clovaspeech-gw.ncloud.com
      port: 50051
      secret-key: ${CLOVA_SPEECH_SECRET_KEY}
      language: ko
      sample-rate: 16000
  llm:
    url: https://api.anthropic.com
    api-key: ${ANTHROPIC_API_KEY}
    model: claude-sonnet-4-6
  tts:
    url: https://naveropenapi.apigw.ntruss.com/tts-premium/v1/tts
    client-id: ${CLOVA_VOICE_CLIENT_ID}
    client-secret: ${CLOVA_VOICE_CLIENT_SECRET}
    speaker: nara
    format: wav
    sampling-rate: 8000
