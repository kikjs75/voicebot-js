# real profile — RTZR WebSocket STT + Google Cloud TTS + Claude LLM
spring:
  config:
    activate:
      on-profile: real
  datasource:
    url: jdbc:mariadb://${DB_HOST:mariadb}:3306/voicebot
  data:
    redis:
      host: ${REDIS_HOST:redis}
    mongodb:
      uri: ${MONGODB_URI:mongodb://mongodb:27017/voicebot}

voicebot:
  stt:
    rtzr:
      client-id: ${RTZR_CLIENT_ID}
      client-secret: ${RTZR_CLIENT_SECRET}
      sample-rate: 16000
      encoding: LINEAR16
  llm:
    url: https://api.anthropic.com
    api-key: ${ANTHROPIC_API_KEY}
    model: claude-sonnet-4-6
  tts:
    google:
      credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS}
      language-code: ko-KR
      voice-name: ko-KR-Neural2-A
      audio-encoding: MP3
      sample-rate-hertz: 24000
