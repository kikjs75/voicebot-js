# 시뮬레이터 모드: docker compose 컨테이너를 바라봄 (voicebot-net)
spring:
  config:
    activate:
      on-profile: sim
  datasource:
    url: jdbc:mariadb://${DB_HOST:mariadb}:3306/voicebot
  data:
    redis:
      host: ${REDIS_HOST:redis}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration

voicebot:
  stt:
    url: ${STT_URL:http://stt-simulator:8081}
  llm:
    url: ${LLM_URL:http://llm-simulator:8082}
  tts:
    url: ${TTS_URL:http://tts-simulator:8083}
