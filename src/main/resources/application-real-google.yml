# real-google profile — RTZR WebSocket STT + Claude LLM + Google Cloud TTS
# DB/Redis 는 application.yml 베이스 설정 사용 (mariadb, redis Docker 호스트명)
spring:
  config:
    activate:
      on-profile: real-google

voicebot:
  stt:
    rtzr:
      client-id: ${RTZR_CLIENT_ID}
      client-secret: ${RTZR_CLIENT_SECRET}
      sample-rate: 8000
      encoding: LINEAR16
  llm:
    url: https://api.anthropic.com
    api-key: ${ANTHROPIC_API_KEY}
    model: claude-sonnet-4-6
  tts:
    google:
      credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS}
      language-code: ko-KR
      voice-name: ko-KR-Neural2-A
      audio-encoding: LINEAR16
      sample-rate-hertz: 8000
